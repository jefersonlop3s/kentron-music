name: kentron_app
description: The main application for Kentron Music Hub.
version: 0.0.0+1
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  # Localizações: os ARBs, o gerador e os delegates vivem em core_l10n. O app
  # não guarda string de interface — só o nome da marca.
  core_l10n:
    path: ../../packages/core_l10n
  # Ponte Rust ↔ Flutter (ADR-0007). Os bindings são gerados por
  # `flutter_rust_bridge_codegen` e vivem em `lib/src/rust/`. A compilação do
  # crate fica com o backend **Native Assets**: `hook/build.dart` (através de
  # `flutter_rust_bridge_hooks` → `native_toolchain_rust`) compila
  # `../../crates/kentron_ffi` e registra o resultado como code asset — sem
  # plugin, sem CocoaPods e sem Gradle no caminho do Rust.
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
