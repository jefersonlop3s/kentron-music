name: kentron_app
description: The main application for Kentron Music Hub.
version: 0.0.0+1
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  # Localizações: os ARBs, o gerador e os delegates vivem em core_l10n. O app
  # não guarda string de interface — só o nome da marca.
  core_l10n:
    path: ../../packages/core_l10n
  # flutter_rust_bridge entra quando a ponte Rust estiver de fato configurada
  # (ADR-0007). Até lá, o app deve compilar sozinho para o CI não falhar em
  # uma dependência inexistente.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
