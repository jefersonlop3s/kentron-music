[package]
name = "notation_bundle"
description = "Canonical chord model, chord naming, song bundle persistence (domain crate)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Primeira dependência externa do workspace (ADR-0006): manifesto `meta.json`,
# índice da biblioteca e setlists. MIT/Apache-2.0, já cobertos por `deny.toml`.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# XML parser para MusicXML (R1.1). Rust puro, MIT/Apache-2.0 — mesma licença
# do workspace. Uso mínimo: eventos em vez de DOM, sem XSD validation.
quick-xml = "0.37"

[lints]
workspace = true
