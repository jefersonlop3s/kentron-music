[package]
name = "mir_engine"
description = "MIR: audio into chord chart, structure and dynamics (ADR-0011)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# FFT madura e auditável (MIT/Apache-2.0). O resto do motor é DSP escrito aqui:
# janela, croma, casamento de acorde, novidade espectral e R128.
rustfft = "6.2"
# O relatório sai em JSON; `serde` já é a primeira dependência externa do
# workspace (ADR-0006), então não abre dependência nova.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# A cifra é montada como objeto do domínio e escrita por `chordpro::write`
# (ADR-0012): o formato do app passa a ser o mesmo por construção, em vez de
# texto montado à mão aqui dentro.
#
# A `version` aqui não é enfeite: `deny.toml` usa `wildcards = "deny"`, e uma
# dependência de caminho sem versão é lida como wildcard pelo cargo-deny — o
# gate `deny` reprovou o push até isto entrar (mesma armadilha documentada no
# `kentron_ffi`).
notation_bundle = { path = "../notation_bundle", version = "0.0.0" }

[lints]
workspace = true

