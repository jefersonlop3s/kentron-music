# Guarda de licenças e fontes (ADR-0001). Tudo que não está em `allow` é negado.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    # Copyleft por arquivo: só como dependência sem modificação (ex.: alphaTab).
    "MPL-2.0",
    # ort (ONNX Runtime) traz webpki-root-certs (CDLA-Permissive-2.0),
    # que é uma licença de dados permissiva sem restrições — aceitável.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# O workspace ainda não tem dependências externas: não avisar por licença permitida sem uso.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
# quick-xml 0.37.5: NsReader OOM (namespace resolver unbounded allocation).
# Não afeta nosso uso — só usamos Reader (plain), não NsReader.
# RUSTSEC-2026-0194 (quick-xml) + RUSTSEC-2026-0195 (quick-xml).
# A versão 0.42 corrige, mas mudou a API de &[u8] para &str —
# a migração fica para quando o workspace tiver tempo de lidar com ela.
ignore = [
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
