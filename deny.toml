# Guarda de licenças e fontes (ADR-0001). Tudo que não está em `allow` é negado.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    # Copyleft por arquivo: só como dependência sem modificação (ex.: alphaTab).
    "MPL-2.0",
]
confidence-threshold = 0.9
# O workspace ainda não tem dependências externas: não avisar por licença permitida sem uso.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
