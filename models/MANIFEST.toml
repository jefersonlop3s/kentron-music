# Manifesto de modelos e pesos de IA (ADR-0001).
#
# Todo arquivo de modelo distribuído com o app ou baixado por ele precisa de uma entrada
# [[model]]. A licença dos PESOS é registrada separadamente da licença do código: um
# projeto pode ser MIT enquanto os pesos têm restrição (ex.: modelos do madmom são
# CC BY-NC-SA 4.0 e NÃO podem entrar).
#
# Licenças aceitas para pesos: as mesmas do deny.toml. Nada de CC BY-NC*.
#
# Exemplo (descomente e preencha ao adotar um modelo, depois do spike correspondente):
#
# [[model]]
# id           = "beat_this"
# purpose      = "beat and downbeat tracking"
# code_license = "MIT"
# weights_license = "MIT"          # confirmar na fonte dos pesos, não só no repositório
# source_url   = "https://github.com/CPJKU/beat_this"
# weights_url  = ""                # URL exata do arquivo usado
# sha256       = ""                # hash do arquivo usado
# format       = "onnx"
# approved_in  = ""                # ADR ou spike que aprovou (ex.: spike S1)

schema = 1

[[model]]
id              = "htdemucs_6s"
purpose         = "separação de fontes para medir a relação bumbo×caixa no metro"
code_license    = "MIT"
weights_license = "MIT"   # LICENSE do repositório (Meta Platforms); sem termo separado para os pesos
source_url      = "https://github.com/facebookresearch/demucs"
weights_url     = "https://dl.fbaipublicfiles.com/demucs/hybrid_transformer/5c90dfd2-34c22ccb.th"
sha256          = "34c22ccb381c6f9fdbf324f04e1e2fe21aaaf293f5ded163a162697ff9a02ddd"
format          = "pytorch"
approved_in     = "ADR-0017"

[[model]]
id              = "htdemucs_6s_onnx"
purpose         = "separação de fontes em ONNX: inferência pelo crate ort em Rust, sem Python"
code_license    = "MIT"         # sevagh/demucs.onnx é MIT
weights_license = "MIT"         # derivado dos pesos htdemucs_6s (MIT); confirmar na fonte do sevagh/demucs.onnx
source_url      = "https://github.com/sevagh/demucs.onnx"
weights_url     = "gerado localmente (ver notas)"
sha256          = "TBD — preencher após geração"
format          = "onnx"
approved_in     = "ADR-0017 (P2 pendente)"

# Geração: clonar sevagh/demucs.onnx --recurse-submodules, instalar deps Python,
#   python scripts/convert-pth-to-onnx.py <dest> --six-source
# Saída: <dest>/htdemucs_6s.onnx, com STFT/iSTFT movido para fora da rede.
# Fontes (índice, nome): 0 drums · 1 bass · 2 other · 3 vocals · 4 guitar · 5 piano
