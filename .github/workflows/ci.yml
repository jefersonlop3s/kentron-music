name: ci

# ADR-0004: o pipeline local (scripts/ci-local.sh) é o portão principal e roda
# antes de cada push. O Actions permanece como rede de segurança: valida pull
# requests em ambiente limpo, aceita execução sob demanda e roda semanalmente
# para detectar drift de dependências. Não dispara em push para a main.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  licenses:
    name: licenças e fontes (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2

  l10n:
    name: i18n (paridade de chaves e placeholders)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 tools/check_arb.py

  flutter:
    name: flutter (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kentron_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Manter em sincronia com .flutter-version.
          flutter-version: '3.50.1'
          channel: 'stable'
          architecture: x64
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: core_l10n (gen-l10n + analyze)
        working-directory: packages/core_l10n
        run: |
          flutter pub get
          flutter gen-l10n
          # --no-fatal-infos: o código gerado emite `info` de depreciação.
          flutter analyze --no-fatal-infos

