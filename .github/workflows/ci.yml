name: ci

# ADR-0004: o pipeline local (scripts/ci-local.sh) é o portão principal e roda
# antes de cada push. O Actions permanece como rede de segurança: valida pull
# requests em ambiente limpo, aceita execução sob demanda e roda semanalmente
# para detectar drift de dependências. Não dispara em push para a main.
#
# FONTE ÚNICA (2026-11-20): este workflow não repete a matriz. Ele instala as
# ferramentas e chama o script. Antes a matriz estava duplicada aqui e no
# script, podendo divergir em silêncio — era item aberto no PENDING. A
# cobertura é a mesma, agora definida num lugar só: Rust (fmt, clippy, test),
# cargo-deny, paridade de ARBs, Flutter do app (analyze, test) e core_l10n
# (gen-l10n + analyze), todos dentro do script.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline local (scripts/ci-local.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Manter em sincronia com .flutter-version.
          flutter-version: '3.50.1'
          channel: 'stable'
          architecture: x64
      # O script exige cargo-deny (fail-loud). O rust-cache acima já guarda
      # ~/.cargo/bin entre execuções, então o custo é só na primeira vez.
      - name: cargo-deny
        run: cargo install --locked cargo-deny
      # O script também exige shellcheck (fail-loud). A imagem do runner já traz
      # o binário; instalar explicitamente evita depender do que a imagem tem.
      - name: shellcheck
        run: sudo apt-get install -y --no-install-recommends shellcheck
      - name: pipeline local
        run: ./scripts/ci-local.sh

